# Setdrift CI — right agent for right job
#
# Five dedicated jobs, each owning a single quality concern:
#   lint      → ruff (style + format)
#   typecheck → mypy (type safety)
#   test      → pytest (all offline tests — no live API key needed)
#   security  → detect-secrets (secret scanning)
#   data-wall → verify gitignore wall has not been accidentally broken
#
# All tests in the repo are explicitly marked "Offline, no API" and mock the
# Anthropic client via fixtures, so no ANTHROPIC_API_KEY secret is required.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel redundant runs on PRs; never cancel on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Principle of least privilege: all jobs get read-only access by default.
permissions:
  contents: read

defaults:
  run:
    working-directory: eval

env:
  # Always install from the lockfile; never silently upgrade transitive deps.
  UV_FROZEN: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  # Offline sentinel — hooks read this variable; tests mock the client, so the
  # value is never sent to Anthropic's API.
  ANTHROPIC_API_KEY: "ci-offline-sentinel"
  SETDRIFT_TELEMETRY_PATH: "/tmp/ci-telemetry.jsonl"

# ---------------------------------------------------------------------------
# Job 1: Lint — ruff agent
# ---------------------------------------------------------------------------
jobs:
  lint:
    name: "Lint · ruff"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: ruff — lint check
        run: uv run ruff check .

      - name: ruff — format check
        run: uv run ruff format --check .

# ---------------------------------------------------------------------------
# Job 2: Type check — mypy agent
# ---------------------------------------------------------------------------
  typecheck:
    name: "Type check · mypy"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: mypy
        # Config comes from [tool.mypy] in pyproject.toml (ignore_missing_imports = true).
        run: uv run mypy setdrift_eval/

# ---------------------------------------------------------------------------
# Job 3: Tests — pytest agent
#   Needs lint to pass first so we don't burn API budget on broken code.
#   All tests are offline; the ANTHROPIC_API_KEY env var is a sentinel only.
# ---------------------------------------------------------------------------
  test:
    name: "Tests · pytest"
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true

      - name: Install package + dev + optimize dependencies
        # --extra optimize installs dspy so the optimizer/rollback tests run for
        # real (not silently skipped). It also pulls litellm→click, which core
        # presidio-analyzer imports at module load. The drift extra is NOT needed:
        # those tests gate themselves with pytest.importorskip(inspect_ai /
        # sentence_transformers), so they skip cleanly without heavy torch.
        run: uv sync --extra dev --extra optimize

      - name: Install lightweight spacy model for the scrubber
        # The presidio scrubber (REQ-SAFETY-01) loads a spacy NER model at import.
        # Production defaults to en_core_web_lg (~560MB); CI uses the ~12MB sm
        # model via SETDRIFT_SPACY_MODEL (set below) — small but still ships the
        # PERSON/EMAIL NER pipeline the safety tests assert on.
        run: uv run python -m spacy download en_core_web_sm

      - name: pytest — full offline suite
        env:
          SETDRIFT_SPACY_MODEL: en_core_web_sm
        run: uv run pytest tests/ setdrift_eval/ -v --tb=short -q

# ---------------------------------------------------------------------------
# Job 4: Security — secret-scanner agent
#   detect-secrets is already a core dependency in pyproject.toml.
#   Excludes gitignored blobs (data/, *.jsonl) and the .env.example template.
# ---------------------------------------------------------------------------
  security:
    name: "Security · detect-secrets"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so detect-secrets can scan all commits, not just HEAD.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true

      - name: Install core dependencies (includes detect-secrets)
        run: uv sync

      - name: detect-secrets scan
        # .env.example is an intentional template with placeholder values.
        # *.lock and *.jsonl blobs are excluded (binary / data wall).
        # Fail the job if any real secret patterns are found.
        shell: bash
        run: |
          uv run detect-secrets scan \
            --exclude-files '\.env\.example$' \
            --exclude-files '.*\.lock$' \
            --exclude-files '.*\.jsonl$' \
            --exclude-files '.*\.sqlite.*$' \
            .. \
            > /tmp/secrets-report.json

          python - <<'EOF'
          import json, sys
          data = json.load(open("/tmp/secrets-report.json"))
          hits = {f: s for f, s in data.get("results", {}).items() if s}
          if not hits:
              print("detect-secrets: no findings — OK")
              sys.exit(0)
          print("SECRETS DETECTED — commit rejected:")
          for fname, findings in hits.items():
              for finding in findings:
                  print(f"  {fname}: {finding['type']} (line {finding.get('line_number', '?')})")
          sys.exit(1)
          EOF

# ---------------------------------------------------------------------------
# Job 5: Data wall — guardian agent
#   Ensures no telemetry JSONL or data/ files have been accidentally tracked.
#   The one legitimate exception (experiments/audit-genealogy.jsonl) is
#   explicitly allowed by the gitignore and whitelisted here.
# ---------------------------------------------------------------------------
  data-wall:
    name: "Data wall · integrity check"
    runs-on: ubuntu-latest
    # Override the default working-directory for this job — it operates on the
    # repo root, not eval/.
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: No unauthorized JSONL files tracked
        shell: bash
        run: |
          # List all tracked .jsonl files.
          tracked=$(git ls-files '*.jsonl')

          # The only permitted JSONL in the tree is the scrubbed genealogy mirror.
          ALLOWED="experiments/audit-genealogy.jsonl"

          violations=""
          while IFS= read -r f; do
            if [ "$f" != "$ALLOWED" ] && [ -n "$f" ]; then
              violations="$violations\n  $f"
            fi
          done <<< "$tracked"

          if [ -n "$violations" ]; then
            echo "DATA WALL VIOLATION: unauthorized .jsonl files are tracked in git:"
            printf "%b\n" "$violations"
            exit 1
          fi
          echo "Data wall OK: only $ALLOWED is tracked"

      - name: No data/ content tracked (except README)
        shell: bash
        run: |
          tracked_data=$(git ls-files 'data/' | grep -v '^data/README\.md$' || true)
          if [ -n "$tracked_data" ]; then
            echo "DATA WALL VIOLATION: data/ files are tracked in git:"
            echo "$tracked_data"
            exit 1
          fi
          echo "Data wall OK: data/ is clean"

      - name: Gitignore covers data/telemetry
        shell: bash
        run: |
          # Create a synthetic telemetry file and confirm git ignores it.
          mkdir -p data/telemetry
          touch data/telemetry/ci-probe.jsonl
          if git check-ignore -q data/telemetry/ci-probe.jsonl; then
            echo "Gitignore OK: data/telemetry/ is covered"
          else
            echo "GITIGNORE FAILURE: data/telemetry/ci-probe.jsonl is NOT gitignored"
            exit 1
          fi
          rm -f data/telemetry/ci-probe.jsonl
