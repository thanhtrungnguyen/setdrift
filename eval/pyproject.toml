[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "setdrift-eval"
version = "0.0.1"
description = "Evaluation harness for the SICA self-improving Claude Code plugin"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Nguyen Thanh Trung" }]
license = { text = "MIT" }
dependencies = [
  "anthropic>=0.40,<1.0",
  "pydantic>=2.5,<3.0",
  "rich>=13",
  "gitpython>=3.1,<4.0",
  # Telemetry scrubber (REQ-SAFETY-01) — layered PII/secret redaction + columnar query.
  "presidio-analyzer==2.2.359",
  "presidio-anonymizer==2.2.362",
  "detect-secrets==1.5.0",
  "duckdb==1.5.3",
  "pyarrow>=20,<25",
  # Measurement layer (Phase 2): intent_skill_map.yaml load (pyyaml) + the
  # F1 scorer / 5-run band / bootstrap-CI stack (REQ-MEASURE-01, plan 02-05).
  "scikit-learn>=1.5,<2.0",
  "scipy>=1.11,<2.0",
  "numpy>=1.26,<3.0",
  "pyyaml>=6,<7",
  # OpenRouter transport (SETDRIFT_LLM_BACKEND=openrouter uses OpenAI Chat-Completions wire format).
  "openai>=1.0",
]

[project.optional-dependencies]
# dspy 3.2.x hard-depends on gepa[dspy]==0.0.27 and exposes dspy.GEPA; do NOT
# add a standalone gepa pin (the research-suggested gepa>=0.1.1 is incompatible
# with dspy>=3.2 — verified unsatisfiable 2026-05-31, see
# .planning/codebase/dspy-rename-smoke-test.md). dspy owns the gepa version.
optimize = ["dspy>=3.2,<4.0"]
# duckdb, scipy, numpy are already in core dependencies — not repeated here.
drift = [
    "inspect-ai>=0.3.220,<0.4",
    "sentence-transformers==5.5.1",
]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests", "setdrift_eval"]
addopts = "-ra -q"

[project.scripts]
setdrift-eval = "setdrift_eval.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["setdrift_eval*"]
